name: Build and Release Pyeduc

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Executable
        run: |
          flet build windows --assets-dir content --exclude .git .github .agents venv .venv data logs tests scripts flatpak docs AGENTS.md ARCHITECTURE.md CHANGELOG.md CONTRIBUTING.md INSTALL.md MANUAL.md README.md LICENSE pyproject.toml requirements.txt run.bat run.sh verify.bat main --cleanup-app --project pyeduc

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyeduc-windows
          path: build/windows/

  build-linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Linux Desktop Support
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev mpv
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Linux Binary
        run: |
          flet build linux --assets-dir content --exclude .git .github .agents venv .venv data logs tests scripts flatpak docs AGENTS.md ARCHITECTURE.md CHANGELOG.md CONTRIBUTING.md INSTALL.md MANUAL.md README.md LICENSE pyproject.toml requirements.txt run.bat run.sh verify.bat main --cleanup-app --project pyeduc

      - name: Create DEB Package
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyeduc-linux-deb
          path: pyeduc_amd64.deb

  build-linux-flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Linux Desktop Support
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev flatpak flatpak-builder elfutils libmpv-dev mpv
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Linux Binary
        run: |
          flet build linux --assets-dir content --exclude .git .github .agents venv .venv data logs tests scripts flatpak docs AGENTS.md ARCHITECTURE.md CHANGELOG.md CONTRIBUTING.md INSTALL.md MANUAL.md README.md LICENSE pyproject.toml requirements.txt run.bat run.sh verify.bat main --cleanup-app --project pyeduc

      - name: Build Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --force-clean build-dir flatpak/org.pyeduc.App.yml
          flatpak build-export repo build-dir
          flatpak build-bundle repo pyeduc.flatpak org.pyeduc.App

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyeduc-linux-flatpak
          path: pyeduc.flatpak

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux-deb, build-linux-flatpak]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: pyeduc-windows
          path: build/windows

      - name: Download DEB Artifact
        uses: actions/download-artifact@v4
        with:
          name: pyeduc-linux-deb
          path: .

      - name: Download Flatpak Artifact
        uses: actions/download-artifact@v4
        with:
          name: pyeduc-linux-flatpak
          path: .

      - name: Package and Rename Artifacts
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          
          mv pyeduc_amd64.deb pyeduc-${VERSION}_amd64.deb
          mv pyeduc.flatpak pyeduc-${VERSION}.flatpak
          
          cd build/windows
          zip -r ../../pyeduc-${VERSION}-windows.zip .
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pyeduc-${{ env.VERSION }}-windows.zip
            pyeduc-${{ env.VERSION }}_amd64.deb
            pyeduc-${{ env.VERSION }}.flatpak
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
