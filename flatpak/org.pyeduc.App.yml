app-id: org.pyeduc.App
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: pyeduc
finish-args:
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
modules:
  - name: pyeduc
    buildsystem: simple
    sources:
      - type: dir
        path: ..
    build-commands:
      - mkdir -p /app/opt/pyeduc
      - cp -r build/linux/* /app/opt/pyeduc/
      - mkdir -p /app/bin
      - ln -s /app/opt/pyeduc/pyeduc /app/bin/pyeduc
      - mkdir -p /app/share/icons/hicolor/scalable/apps
      - cp content/icons/pyeduc.svg /app/share/icons/hicolor/scalable/apps/org.pyeduc.App.svg
      - mkdir -p /app/share/applications
      - |
        cat << 'EOF' > /app/share/applications/org.pyeduc.App.desktop
        [Desktop Entry]
        Name=Pyeduc
        Exec=pyeduc
        Icon=org.pyeduc.App
        Type=Application
        Categories=Education;Development;
        EOF
